# k8s/proxy/proxy-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: coding-genie-proxy
  namespace: coding-genie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coding-genie-proxy
  template:
    metadata:
      labels:
        app: coding-genie-proxy
    spec:
      containers:
        - name: coding-genie-proxy
          image: 12072000/coding-genie-proxy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: coding-genie-shared-config
          env:
            - name: REDIS_URL
              value: "redis://redis-0.redis.coding-genie.svc.cluster.local:6379" 
            - name: PORT
              value: "80"
---
apiVersion: v1
kind: Service
metadata:
  name: coding-genie-proxy
  namespace: coding-genie
spec:
  selector:
    app: coding-genie-proxy
  ports:
    - port: 80
      targetPort: 80