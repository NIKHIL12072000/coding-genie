apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coding-genie-ingress
  namespace: coding-genie
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
  # 1. Main Website Route (The Frontend!)
  - host: "codinggenie.in"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coding-genie-frontend
            port:
              number: 80
              
  - host: "www.codinggenie.in"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coding-genie-frontend
            port:
              number: 80

  # 2. Previews Route
  - host: "*.previews.codinggenie.in"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: coding-genie-proxy
            port:
              number: 80
  
  # 3. API Gateway Route
  - host: "api.codinggenie.in"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80