# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: coding-genie

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: coding-genie-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: coding-genie-shared-config
  namespace: coding-genie
data:
  APP_PREVIEW_DOMAIN: "previews.codinggenie.in"
  APP_PREVIEW_NAMESPACE: "coding-genie-previews"
  APP_PROXY_PORT: "80"
  APP_FRONTEND_URL: "http://codinggenie.in"
